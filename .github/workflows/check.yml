name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Validate tool detail pages
        run: npm run check:detail
      - name: Test BUILD LOG generation
        run: npm run test:build-logs
      - name: Build with fixture
        run: npm run build
      - name: Validate generated site
        run: npm run check:dist
